<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flowstack X header">
  <title>Flowstack — X (Twitter) header, 1500×500 — ink on paper</title>
  <!-- ground: the white sheet -->
  <rect width="1500" height="500" fill="#FFFFFF"/>

  <!-- 160px grid (matches the live site body) -->
  <g stroke="rgba(0,0,0,0.08)" stroke-width="1">
    <line x1="0" y1="160" x2="1500" y2="160"/>
    <line x1="0" y1="320" x2="1500" y2="320"/>
    <line x1="0" y1="480" x2="1500" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="960" y1="0" x2="960" y2="500"/>
    <line x1="1120" y1="0" x2="1120" y2="500"/>
    <line x1="1280" y1="0" x2="1280" y2="500"/>
    <line x1="1440" y1="0" x2="1440" y2="500"/>
  </g>

  <!-- corner registration ticks -->
  <g stroke="#000000" stroke-width="3" fill="none">
    <path d="M40 60 L40 40 L60 40"/>
    <path d="M1440 40 L1460 40 L1460 60"/>
    <path d="M40 440 L40 460 L60 460"/>
    <path d="M1440 460 L1460 460 L1460 440"/>
  </g>

  <!-- sheet ref top-left -->
  <g font-family="ui-monospace, Menlo, monospace" fill="#8A8A8A" font-size="18" letter-spacing="4">
    <rect x="100" y="60" width="14" height="14" fill="#F5C518" stroke="#000000" stroke-width="2"/>
    <text x="130" y="73" letter-spacing="4">FIG. 00 / FLOWSTACK</text>
  </g>

  <!-- wide mark, centered-ish -->
  <g transform="translate(100 150) scale(0.85)">
    <path d="M0 110 H120" stroke="#000000" stroke-width="15"/>
    <rect x="135" y="47.5" width="410" height="125" stroke="#000000" stroke-width="15" fill="none"/>
    <rect x="205" y="85" width="50" height="50" fill="#000000"/>
    <rect x="375" y="85" width="50" height="50" stroke="#000000" stroke-width="10" fill="none"/>
    <path d="M545 110 H660" stroke="#000000" stroke-width="15"/>
    <path d="M635 75 L680 110 L635 145" stroke="#000000" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  </g>

  <!-- tagline, right of the mark — canonical three-beat, third beat on
       the marker-highlight swipe (ink text over signal yellow) -->
  <g font-family="sans-serif" fill="#000000" font-weight="600" font-size="44">
    <text x="730" y="196">Automate the busywork.</text>
    <text x="730" y="248" fill="#525252">Aggregate the data.</text>
    <rect x="720" y="262" width="500" height="50" fill="#F5C518"/>
    <text x="730" y="300" fill="#141412">Answer every inbound.</text>
  </g>

  <!-- dimension line + annotation under tagline -->
  <line x1="730" y1="340" x2="846" y2="340" stroke="#525252" stroke-width="2"/>
  <text x="862" y="347" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="3" fill="#8A8A8A">€99/MO · CANCEL ANYTIME</text>

  <!-- baseline strip -->
  <line x1="100" y1="430" x2="1400" y2="430" stroke="rgba(0,0,0,0.14)" stroke-width="1"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="4" fill="#8A8A8A">
    <text x="100" y="460" fill="#000000" letter-spacing="2">FLOWSTACK / AUTOMATION</text>
    <text x="1400" y="460" text-anchor="end">SHEET 01 · REV B · SCALE 1:1</text>
  </g>
</svg>
