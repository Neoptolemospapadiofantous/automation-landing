<svg width="1128" height="191" viewBox="0 0 1128 191" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flowstack LinkedIn company cover">
  <title>Flowstack — LinkedIn company cover, 1128×191 — ink on paper</title>
  <rect width="1128" height="191" fill="#FFFFFF"/>

  <!-- grid background -->
  <g stroke="rgba(0,0,0,0.08)" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="191"/>
    <line x1="320" y1="0" x2="320" y2="191"/>
    <line x1="640" y1="0" x2="640" y2="191"/>
    <line x1="960" y1="0" x2="960" y2="191"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <path d="M24 36 L24 24 L36 24"/>
    <path d="M1092 24 L1104 24 L1104 36"/>
    <path d="M24 155 L24 167 L36 167"/>
    <path d="M1092 167 L1104 167 L1104 155"/>
  </g>

  <!-- wide mark — row centered on the canvas (mark 237-523 + text 607-897,
       row center ~564); also clears the Page logo tile overlapping lower-left -->
  <g transform="translate(237 50) scale(0.42)">
    <path d="M0 110 H120" stroke="#000000" stroke-width="15"/>
    <rect x="135" y="47.5" width="410" height="125" stroke="#000000" stroke-width="15" fill="none"/>
    <rect x="205" y="85" width="50" height="50" fill="#000000"/>
    <rect x="375" y="85" width="50" height="50" stroke="#000000" stroke-width="10" fill="none"/>
    <path d="M545 110 H660" stroke="#000000" stroke-width="15"/>
    <path d="M635 75 L680 110 L635 145" stroke="#000000" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  </g>

  <!-- tagline right of mark — canonical three-beat, third beat on the
       marker-highlight swipe -->
  <g font-family="sans-serif" font-weight="600" font-size="25">
    <text x="607" y="66" fill="#000000">Automate the busywork.</text>
    <text x="607" y="98" fill="#525252">Aggregate the data.</text>
    <rect x="601" y="108" width="290" height="29" fill="#F5C518"/>
    <text x="607" y="130" fill="#141412">Answer every inbound.</text>
  </g>

  <!-- baseline -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="3" fill="#8A8A8A">
    <text x="1104" y="162" text-anchor="end">FLOWSTACK / AUTOMATION  ·  REV D  ·  SCALE 1:1</text>
  </g>
</svg>
