<svg width="1584" height="396" viewBox="0 0 1584 396" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flowstack LinkedIn personal cover">
  <title>Flowstack — LinkedIn personal cover, 1584×396 (profile photo overlaps lower-left) — ink on paper</title>
  <rect width="1584" height="396" fill="#FFFFFF"/>

  <!-- grid -->
  <g stroke="rgba(0,0,0,0.08)" stroke-width="1">
    <line x1="320" y1="0" x2="320" y2="396"/>
    <line x1="640" y1="0" x2="640" y2="396"/>
    <line x1="960" y1="0" x2="960" y2="396"/>
    <line x1="1280" y1="0" x2="1280" y2="396"/>
    <line x1="0" y1="160" x2="1584" y2="160"/>
    <line x1="0" y1="320" x2="1584" y2="320"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#000000" stroke-width="3" fill="none">
    <path d="M40 60 L40 40 L60 40"/>
    <path d="M1524 40 L1544 40 L1544 60"/>
    <path d="M40 336 L40 356 L60 356"/>
    <path d="M1524 356 L1544 356 L1544 336"/>
  </g>

  <!-- sheet ref -->
  <g font-family="ui-monospace, Menlo, monospace" fill="#8A8A8A" font-size="18" letter-spacing="4">
    <rect x="100" y="60" width="14" height="14" fill="#F5C518" stroke="#000000" stroke-width="2"/>
    <text x="130" y="73">FIG. 00 / FLOWSTACK</text>
  </g>

  <!-- wide mark — biased to the RIGHT half to leave room for the
       overlapping LinkedIn profile photo at lower-left -->
  <g transform="translate(680 130) scale(0.7)">
    <path d="M0 110 H120" stroke="#000000" stroke-width="15"/>
    <rect x="135" y="47.5" width="410" height="125" stroke="#000000" stroke-width="15" fill="none"/>
    <rect x="205" y="85" width="50" height="50" fill="#000000"/>
    <rect x="375" y="85" width="50" height="50" stroke="#000000" stroke-width="10" fill="none"/>
    <path d="M545 110 H660" stroke="#000000" stroke-width="15"/>
    <path d="M635 75 L680 110 L635 145" stroke="#000000" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  </g>

  <!-- tagline below mark — canonical three-beat, third beat on the
       marker-highlight swipe -->
  <g font-family="sans-serif" font-weight="600" font-size="26">
    <text x="680" y="312" fill="#000000">Automate the busywork.</text>
    <text x="680" y="344" fill="#525252">Aggregate the data.</text>
    <rect x="674" y="353" width="302" height="30" fill="#F5C518"/>
    <text x="680" y="376" fill="#141412">Answer every inbound.</text>
  </g>

  <!-- baseline — short form so it clears the tagline block to its left -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3" fill="#8A8A8A">
    <text x="1544" y="370" text-anchor="end">REV B · SCALE 1:1</text>
  </g>
</svg>
